# config/laptop.yaml
# Laptop (hostname: Io) — machine profile configuration.

disk:
  disk_by_id: nvme-addlink_M.2_PCIE_G3x4_NVMe_C1D307020D0900995114
  boot_part: -part1
  root_part: -part3

root:
  mode: reuse
  subvolumes:
    - name: "@pkg"
      reuse: yes
    - name: "@home"
      reuse: no
    - name: "@tailscale"
      mount: /var/lib/tailscale
      reuse: yes

additional_mounts:
  - name: personal
    disk_by_id: nvme-addlink_M.2_PCIE_G3x4_NVMe_C1D307020D0900995114
    type: ssd
    part: -part2
    mountpoint: /mnt/Personal

system:
  hostname: Io

boot:
  bootloader: limine
  init: dracut

arch:
  de: gnome, hyprland

pkgprofile:
  post:
    - hardware
    - office
    - development
    - multimedia
    - codecs

machine_specific:
  pacman:
    - fprintd
    - tesseract-data-eng
  aur:
    - frog-ocr-no-telemetry
    - icaclient
  services:
    - bluetooth

features:
  local_aur_repo:
    client:
      enabled: true

  reflector:
    enabled: true

  firewall:
    enabled: true

  zram:
    enabled: true

  plymouth:
    enabled: true

  tailscale:
    enabled: true
    config:
      auto_up: true

  pia:
    enabled: true

  snapper:
    enabled: true

  ssh:
    enabled: true

  antigravity:
    enabled: true

  webapps:
    enabled: true

  btrfs_maintenance:
    enabled: true

  ananicy:
    enabled: true

network:
  hosts:
    media.local: 192.168.40.100
    media.remote: 100.100.1.1
    kvm.local: 192.168.10.155
    kvm.remote: 100.100.1.3
    desktop.local: 192.168.10.165
    modem.local: 192.168.1.254

postconfig:
  user_dirs:
    enabled: true

  dotfiles:
    enabled: true

  bluetooth:
    enabled: true

  gnome:
    gsettings:
      enabled: true

    lockscreen_scaling:
      enabled: true

    color_profiles:
      enabled: true

    theme:
      cursor:
        enabled: true
      wallpapers:
        enabled: true

    extensions:
      enabled: true
      ids:
        - 517   # Caffeine
        - 6856  # Chronos Time Tracker
        - 6583  # Auto Power Profile

    appdrawer:
      enabled: true
      layout:
        - # page 1 (alphabetical by display name)
          - org.gnome.Decibels        # Audio Player
          - org.gnome.Calculator      # Calculator
          - org.gnome.Calendar        # Calendar
          - org.gnome.clocks          # Clocks
          - code-oss                  # Code - OSS
          - org.gnome.SimpleScan      # Document Scanner
          - org.gnome.Papers          # Document Viewer
          - gimp                      # GNU Image Manipulation Program
          - org.gnome.Loupe           # Image Viewer
          - Office                    # Office
          - System                    # System
          - Utilities                 # Utilities
          - org.gnome.Showtime        # Video Player
          - org.gnome.Weather         # Weather
          - Webapps                   # Webapps

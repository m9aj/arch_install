# config/base.yaml
# Base configuration — default settings across core system, packages, features, and post-install.
# All profile configurations (desktop, laptop, server) build on and override options defined here.

# ==========================================
# 1. CORE SYSTEM & DISK SETTINGS
# ==========================================

disk:
  disk_by_id:                             # udev ID from /dev/disk/by-id/ (without the path prefix)
  boot_part:                              # partition suffix for EFI, e.g. -part1
  root_part:                              # partition suffix for root, e.g. -part3
  mount_ops_ssd: noatime,compress=zstd:3,ssd,space_cache=v2
  mount_ops_oth: nosuid,nodev,nofail,x-gvfs-show  # applied to additional_mounts
  mount_ops_hdd: noatime,autodefrag

root:
  mode: reuse                             # format | reuse
  subvolumes:
    - name: "@"
      mount: /
      reuse: no                           # no = delete and recreate on install
    - name: "@home"
      mount: /home
      reuse: yes                          # yes = keep across reinstalls
    - name: "@var_log"
      mount: /var/log
      reuse: no
    - name: "@var_cache"
      mount: /var/cache
      reuse: no
    - name: "@var_tmp"
      mount: /var/tmp
      reuse: no
    - name: "@pkg"
      mount: /var/cache/pacman/pkg
      reuse: yes
    - name: "@ssh"
      mount: /etc/ssh
      reuse: yes


system:
  hostname:
  timezone: America/Los_Angeles           # America/New_York | Asia/Kolkata | etc.
  root_password:                          # Defined in config/secrets.yaml[.age]
  username: ajay
  fullname: 'Ajay Moganti'
  user_password:                          # Defined in config/secrets.yaml[.age]
  autologin: false                        # GDM auto-login (no password on boot)

additional_mounts: []                     # Extra storage partitions to mount

bind_mounts: []                           # Custom directories to bind-mount during installation

hardware:
  cpu: auto                               # amd | intel | auto (detected via lscpu)
  gpu: auto                               # amd | nvidia | auto (detected via lspci)

boot:
  bootloader: limine                      # limine | systemd-boot | none
  init: mkinitcpio                        # mkinitcpio | dracut
  kernel_params:
    - quiet
    - rw
  systemd-boot:
    timeout: 3
    console-mode: auto
    editor: yes
  limine:
    timeout: 3
    remember_last_entry: yes
    verbose: no
    interface_branding: auto              # auto (uses system.hostname or 'Arch Linux') or custom string
    interface_branding_colour: CCCCCC
    interface_help_hidden: yes
    interface_help_colour: CCCCCC
    term_background: DD000000
    term_foreground: FFFFFF
    term_font_scale: 2x2
    term_margin: 0
    wallpaper: true

arch:
  label: Arch                             # Btrfs filesystem label
  de: gnome                               # Supported: gnome | kde | hyprland (or [gnome, hyprland])
                                          # NOTE: Avoid the triple combination (gnome + kde + hyprland).
                                          # Co-installing GNOME and KDE causes application duplication
                                          # (dual file managers, dual calculators), keyring friction
                                          # (gnome-keyring vs kwallet prompts), and MIME/portal clashes.
                                          # Dual combinations (e.g. gnome + hyprland) share GDM and GTK cleanly.

# ==========================================
# 2. PACKAGE SELECTION & PROFILES
# ==========================================

# Keys map to entries in config/package_profiles.yaml
pkgprofile:
  core:                                   # Installed via pacstrap (live ISO phase)
    - base_core
    - audio
    - shell
    - others
  post:                                   # Installed via pacman after chroot
    - base_drivers
    #- hardware
    - fonts
    - shell
    #- office
    - internet
    #- development
    - system
    #- multimedia
    #- codecs
    - security
    - backup
    #- android
    #- music_batching
    #- partitioning
    #- bios

machine_specific:
  pacman: []                              # Extra pacman packages not in any profile
  aur_helper: paru                       # paru | none
  aur: []
  services: []

# ==========================================
# 3. FEATURES & MODULES
# ==========================================

features:
  local_aur_repo:
    server:
      enabled: false
      config:
        name: local-aur-repo              # Repo name used in pacman.conf
        path: /srv/local-aur-repo         # Directory served by nginx
        port: 8080
        extra_packages: []                # AUR packages to build beyond machine profiles
    client:
      enabled: false
      config:
        url: http://aur.local:8080/local-aur-repo
        tailscale_ip: 100.100.1.1          # Pinned in /etc/hosts as aur.local when tailscale is enabled
        lan_ip: 192.168.40.100             # Pinned in /etc/hosts as aur.local when tailscale is disabled

  reflector:
    enabled: true
    config:
      save: /etc/pacman.d/mirrorlist
      protocol: https
      country: United States
      latest: 10
      sort: rate
      age: 24

  firewall:
    enabled: true

  zram:
    enabled: true
    config:
      size: "min(ram / 2, 4096)"
      compression: zstd
      vm:
        swappiness: 180
        watermark_boost_factor: 0
        watermark_scale_factor: 125
        page_cluster: 0

  plymouth:
    enabled: true
    config:
      theme: spinner

  tailscale:
    enabled: false
    config:
      auto_up: false

  pia:
    enabled: false
    config:
      username:                           # Defined in config/secrets.yaml[.age]
      password:                           # Defined in config/secrets.yaml[.age]
      hosts: US California

  snapper:
    enabled: false
    config:
      target: /mnt/Personal             # Subvolume to snapshot
      name: Personal                    # Snapper config name
      timeline_limit_hourly: 5
      timeline_limit_daily: 7

  ssh:
    enabled: false

  antigravity:
    enabled: false

  webapps:
    enabled: false

  btrfs_maintenance:
    enabled: true
    config:
      scrub_period: monthly
      balance_period: monthly
      defrag_period: none
      trim_period: none

  ananicy:
    enabled: true

# ==========================================
# 4. POST-INSTALLATION CONFIGURATION
# ==========================================

network:

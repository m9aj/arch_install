# config/desktop.yaml
# Desktop (hostname: Titan) — machine profile configuration.

disk:
  disk_by_id: nvme-Sabrent_Rocket_4.0_1TB_03F1079B0E4400624890
  boot_part: -part1
  root_part: -part3

root:
  mode: reuse
  subvolumes:
    - name: "@pkg"
      reuse: yes
    - name: "@home"
      reuse: no

additional_mounts:
  - name: personal
    disk_by_id: nvme-Sabrent_Rocket_4.0_1TB_03F1079B0E4400624890
    type: ssd
    part: -part2
    mountpoint: /mnt/Personal

system:
  hostname: Titan

boot:
  bootloader: limine
  init: mkinitcpio

pkgprofile:
  post:
    - hardware
    - office
    - development
    - multimedia
    - codecs

machine_specific:
  pacman:
    - tesseract-data-eng
  aur:
    - frog-ocr-no-telemetry
    - icaclient

features:
  local_aur_repo:
    client:
      enabled: true

  reflector:
    enabled: true

  firewall:
    enabled: true

  zram:
    enabled: true

  plymouth:
    enabled: true

  tailscale:
    enabled: false
    config:
      auto_up: false

  pia:
    enabled: false

  snapper:
    enabled: false

  ssh:
    enabled: true

  antigravity:
    enabled: true

  webapps:
    enabled: true

  btrfs_maintenance:
    enabled: true

  ananicy:
    enabled: true

network:
  hosts:
    media.local: 192.168.40.100
    kvm.local: 192.168.10.155
    laptop.local: 192.168.10.160
    modem.local: 192.168.1.254
    
postconfig:
  user_dirs:
    enabled: true

  dotfiles:
    enabled: true

  bluetooth:
    enabled: false

  gnome:
    gsettings:
      enabled: true

    lockscreen_scaling:
      enabled: true

    color_profiles:
      enabled: false

    theme:
      cursor:
        enabled: true
      wallpapers:
        enabled: true

    extensions:
      enabled: true
      ids:
        - 517   # Caffeine
        - 6856  # Chronos Time Tracker
        - 6583  # Auto Power Profile

    appdrawer:
      enabled: true
      layout:
        - # page 1 (alphabetical by display name)
          - org.gnome.Decibels        # Audio Player
          - org.gnome.Calculator      # Calculator
          - org.gnome.Calendar        # Calendar
          - org.gnome.clocks          # Clocks
          - code-oss                  # Code - OSS
          - org.gnome.SimpleScan      # Document Scanner
          - org.gnome.Papers          # Document Viewer
          - gimp                      # GNU Image Manipulation Program
          - org.gnome.Loupe           # Image Viewer
          - Office                    # Office
          - System                    # System
          - Utilities                 # Utilities
          - org.gnome.Showtime        # Video Player
          - org.gnome.Weather         # Weather
          - Webapps                   # Webapps

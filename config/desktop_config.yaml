# config/desktop_config.yaml
# Desktop — post-install configuration overrides.

network:
  hosts:
    media.local:   192.168.0.150
    kvm.local: 192.168.0.155
    laptop.local: 192.168.0.160 


postconfig:
  user_dirs:
    enabled: true

  dotfiles:
    enabled: true

  bluetooth:
    enabled: false

  gnome:
    gsettings:
      enabled: true

    lockscreen_scaling:
      enabled: true

    color_profiles:
      enabled: false

    theme:
      icons:
        enabled: false
      cursor:
        enabled: true
      wallpapers:
        enabled: true

    extensions:
      enabled: true
      ids:
        #- 5489  # Search Light
        - 517   # Caffeine
        - 6856  # Chronos Time Tracker
        - 6583  # Auto Power Profile

    appdrawer:
      enabled: true
      layout:
        - # page 1
          - org.gnome.Decibels
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.clocks
          - org.gnome.SimpleScan
          - org.gnome.Papers
          - gimp
          - org.gnome.Loupe
          - Office
          - System
          - Utilities
          - org.gnome.Showtime
          - org.gnome.Weather
          #- org.gnome.Epiphany

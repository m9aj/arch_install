# config/laptop_features.yaml
# Laptop — enabled features and post-install configuration.

features:
    local_aur_repo:
      client:
        enabled: true

    reflector:
      enabled: true

    firewall:
      enabled: true

    gsconnect:
      enabled: true

    zram:
      enabled: true

    plymouth:
      enabled: true

    tailscale:
      enabled: true
      config:
        auto_up: true

    pia:
      enabled: true

    snapper:
      enabled: true

    ssh:
      enabled: true

    claude_code:
      enabled: false

    antigravity:
      enabled: true

    webapps:
      enabled: true

    btrfs_maintenance:
      enabled: true

    ananicy:
      enabled: true      

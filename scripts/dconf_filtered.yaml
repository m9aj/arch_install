    ''libreoffice-startcenter.desktop'', ''libreoffice-base.desktop'', ''libreoffice-draw.desktop'',
    ''libreoffice-math.desktop'', ''conncentre.desktop'']'
  name: '''Office'''

org.gnome.desktop.app-folders.folders.Pardus:

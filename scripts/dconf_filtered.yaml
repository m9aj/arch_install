# Modified dconf settings (converted from dconf dump /)
ca.desrt.dconf-editor:
  restore-view: 'false'
  show-warning: 'false'

org.gnome.Console:
  custom-font: '''JetBrainsMono Nerd Font 13'''
  last-window-maximised: 'false'
  last-window-size: (732, 528)

org.gnome.TextEditor:
  restore-session: 'false'

org.gnome.control-center:

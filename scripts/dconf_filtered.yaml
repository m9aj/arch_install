    ''com.github.tenderowl.frog.desktop'', ''filezilla.desktop'', ''org.gnome.Screenshot.desktop'',
    ''simple-scan.desktop'', ''org.gnome.Logs.desktop'', ''btrfs-assistant.desktop'',
    ''com.github.wwmm.easyeffects.desktop'']'
